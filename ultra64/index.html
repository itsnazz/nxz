<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NLW 64 // N64 Web Player & Creator Testbench</title><style>html,body{height:100%;margin:0;background:#07080f;color:#f8fafc;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.load{opacity:.8}</style></head><body><div class="load">Loading NLW 64…</div><script>(async()=>{try{const fs=["payload-0.txt","payload-1.txt","payload-2.txt","payload-3.txt","payload-4.txt"];const b64=(await Promise.all(fs.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f+' '+r.status);return r.text()})))).join('');const bin=atob(b64);const u8=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;padding:24px">NLW 64 failed to load.\n'+e+'</pre>'}})()</script></body></html>
