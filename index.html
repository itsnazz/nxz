
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NXZ OS v54 – Unified Master Firmware</title>

<style>
:root{
  --ease:cubic-bezier(.22,.9,.3,1);
  --accent:#38bdf8;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Inter,system-ui;
  overflow:hidden;
  color:white;
  background:linear-gradient(-45deg,#0f172a,#1e293b,#0f172a,#1e293b);
  background-size:400% 400%;
  animation:bgShift 25s ease infinite;
}
body.static-bg{background:#0f172a;animation:none;}
body.alt-bg{background:radial-gradient(circle at top,#111827,#000);animation:none;}

@keyframes bgShift{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* Boot */
.boot{
  position:fixed;inset:0;background:black;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;z-index:9999;cursor:pointer;
}
.boot-logo{
  font-size:3rem;font-weight:900;letter-spacing:8px;
  background:linear-gradient(90deg,#38bdf8,#8b5cf6,#38bdf8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.boot.fade-out{animation:fadeOut .6s forwards}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

/* Shutdown */
.shutdown{
  position:fixed;inset:0;background:black;
  display:flex;align-items:center;justify-content:center;
  z-index:10000;opacity:0;pointer-events:none;
  transition:opacity 1s ease;
}
.shutdown.active{opacity:1;pointer-events:all;}
.shutdown-logo{
  font-size:3rem;font-weight:900;letter-spacing:8px;
  background:linear-gradient(90deg,#38bdf8,#8b5cf6,#38bdf8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:powerDown 1.8s ease forwards;
}
@keyframes powerDown{0%{transform:scale(1);opacity:1}100%{transform:scale(0);opacity:0}}

/* Ambient */
.ambient{
  position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at center,var(--accent),transparent 60%);
  opacity:.12;transition:background .6s var(--ease), opacity 1s ease;
}

/* Engine */
.menu-wrapper{position:absolute;top:120px;bottom:130px;left:0;right:0;overflow:hidden;perspective:1200px}
.camera{height:100%;display:flex;align-items:center;will-change:transform}
.tilt{display:flex;gap:160px;transform-style:preserve-3d;will-change:transform}

.tile{
  width:300px;height:300px;border-radius:50px;
  background-size:cover;background-position:center;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:35px;font-weight:900;font-size:1.2rem;
  transition:transform .4s var(--ease), box-shadow .4s var(--ease), filter .4s;
  cursor:pointer;
}
.tile:hover{filter:brightness(1.1)}
.tile.active{transform:scale(1.22);box-shadow:0 0 80px var(--accent);}

/* Panels */
.panel{
  position:fixed;left:0;right:0;bottom:-100%;
  height:85%;background:#0f172a;
  border-radius:50px 50px 0 0;
  padding:60px;overflow:auto;
  transition:bottom .6s var(--ease), opacity .6s var(--ease);
  opacity:0;z-index:5;
}
.panel.active{bottom:0;opacity:1}

.close-arrow{
  position:absolute;top:15px;left:50%;
  transform:translateX(-50%);
  font-size:2rem;cursor:pointer;
}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-top:40px}
.card{
  background:rgba(255,255,255,.07);
  padding:20px;border-radius:20px;
  cursor:pointer;transition:.3s
}
.card:hover{background:rgba(255,255,255,.2);transform:translateY(-6px)}

/* Settings */
.settings-section{margin-bottom:25px}
.toggle-btn{
  background:rgba(255,255,255,.1);
  padding:10px 15px;border-radius:15px;
  display:inline-block;margin-right:10px;
  cursor:pointer;transition:.3s
}
.toggle-btn.active{background:var(--accent)}

/* HUD */
.bottom-dock{
  position:fixed;bottom:0;left:0;right:0;height:100px;
  display:flex;justify-content:center;align-items:center;
  gap:120px;backdrop-filter:blur(20px);
  background:rgba(0,0,0,.35);z-index:10
}
.dock-item{font-size:2.5rem;opacity:.6;cursor:pointer;transition:.4s}
.dock-item.active{opacity:1;transform:translateY(-12px) scale(1.15)}
</style>
</head>
<body>

<div class="boot" id="bootScreen">
  <div class="boot-logo">NXZ OS</div>
  <div style="opacity:.6;margin-top:15px">Click to Start</div>
</div>

<div class="shutdown" id="shutdownScreen">
  <div class="shutdown-logo">NXZ OS</div>
</div>

<div class="ambient" id="ambient"></div>

<div class="menu-wrapper">
  <div class="camera" id="camera">
    <div class="tilt" id="tilt">
      <div class="tile" data-accent="#ef4444" style="background-image:url('Untitled Project.jpg')">EMULATORS</div>
      <div class="tile" data-accent="#3b82f6" style="background-image:url('ROMS.jpg')">ROMS</div>
      <div class="tile" data-accent="#8b5cf6" style="background-image:url('TRAINER.jpg')">TRAINERS</div>
      <div class="tile" data-accent="#22c55e" style="background-image:url('ANDROID.jpg')">ANDROID</div>
    </div>
  </div>
</div>

<div class="panel" id="contentPanel">
  <div class="close-arrow" onclick="closePanel()">⬇</div>
  <h2 id="panelTitle"></h2>
  <div class="grid" id="panelGrid"></div>
</div>

<div class="panel" id="settingsPanel">
  <div class="close-arrow" onclick="closeSettings()">⬇</div>
  <h2>Settings</h2>

  <div class="settings-section">
    <div class="toggle-btn" id="musicToggle">Toggle Music</div>
    <div class="toggle-btn" id="ambientToggle">Toggle Glow</div>
  </div>

  <div class="settings-section">
    <div class="toggle-btn" id="bgAnimated">Animated BG</div>
    <div class="toggle-btn" id="bgStatic">Static BG</div>
    <div class="toggle-btn" id="bgAlt">Alt Dark</div>
  </div>

  <div class="settings-section">
    <div>Arrow Keys – Navigate</div>
    <div>Enter – Open Section</div>
    <div>Escape – Close Panel</div>
    <div>Shift + S – Shutdown</div>
  </div>
</div>

<div class="bottom-dock">
  <div class="dock-item active" onclick="goHome()">🏠</div>
  <div class="dock-item" onclick="openSettings()">⚙️</div>
</div>

<audio id="bgMusic" loop src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3"></audio>

<script>
let shutdownTriggered=false;
const bgMusic=document.getElementById("bgMusic");
const ambient=document.getElementById("ambient");

document.getElementById("bootScreen").addEventListener("click", async ()=>{
  if(!document.fullscreenElement){
    try{await document.documentElement.requestFullscreen();}catch(e){}
  }
  document.getElementById("bootScreen").classList.add("fade-out");
  bgMusic.play().catch(()=>{});
});

/* Settings */
document.getElementById("musicToggle").onclick=()=>{
  if(bgMusic.paused){bgMusic.play();}
  else{bgMusic.pause();}
};
document.getElementById("ambientToggle").onclick=()=>{
  ambient.style.display=ambient.style.display==="none"?"block":"none";
};
document.getElementById("bgAnimated").onclick=()=>{document.body.className="";};
document.getElementById("bgStatic").onclick=()=>{document.body.className="static-bg";};
document.getElementById("bgAlt").onclick=()=>{document.body.className="alt-bg";};

/* Shutdown */
document.addEventListener("keydown",e=>{
  if(shutdownTriggered) return;
  if(e.shiftKey && e.key.toLowerCase()==="s"){
    shutdownTriggered=true;
    ambient.style.opacity="0";
    let fade=setInterval(()=>{
      if(bgMusic.volume>0.02){bgMusic.volume-=0.02;}
      else{bgMusic.pause();clearInterval(fade);}
    },50);
    document.getElementById("shutdownScreen").classList.add("active");
  }
});

/* Engine */
const tiles=document.querySelectorAll(".tile");
const camera=document.getElementById("camera");
const tilt=document.getElementById("tilt");
let activeIndex=0,velocity=0,friction=.92;

function centerPos(i){const w=300,g=160,vw=window.innerWidth;return (vw/2 - w/2) - i*(w+g);}
let cameraX=centerPos(0);

function animate(){
 if(shutdownTriggered) return;
 velocity*=friction;cameraX+=velocity;
 const min=centerPos(tiles.length-1),max=centerPos(0);
 if(cameraX<min)cameraX=min;if(cameraX>max)cameraX=max;
 camera.style.transform=`translateX(${cameraX}px)`;
 requestAnimationFrame(animate);
}
animate();

function updateActive(){
 tiles.forEach(t=>t.classList.remove("active"));
 const tile=tiles[activeIndex];tile.classList.add("active");
 const accent=tile.dataset.accent;
 document.documentElement.style.setProperty("--accent",accent);
 ambient.style.background=`radial-gradient(circle at center, ${accent}, transparent 60%)`;
}
updateActive();

document.addEventListener("keydown",e=>{
 if(shutdownTriggered) return;
 if(e.key==="ArrowRight"){activeIndex=Math.min(activeIndex+1,tiles.length-1);velocity-=40;}
 if(e.key==="ArrowLeft"){activeIndex=Math.max(activeIndex-1,0);velocity+=40;}
 if(e.key==="Enter"){launch();}
 if(e.key==="Escape"){closePanel();closeSettings();}
 updateActive();
});

document.addEventListener("mousemove",e=>{
 if(shutdownTriggered) return;
 const x=(e.clientX/window.innerWidth-.5)*4;
 const y=(e.clientY/window.innerHeight-.5)*4;
 tilt.style.transform=`rotateY(${x}deg) rotateX(${-y}deg)`;
});

/* Full Link Set */
const data={
 EMULATORS:[
  ["Mesen","https://www.mesen.ca"],
  ["Snes9x","https://www.snes9x.com"],
  ["Dolphin","https://dolphin-emu.org"],
  ["PCSX2","https://pcsx2.net"],
  ["RPCS3","https://rpcs3.net"],
  ["Xemu","https://xemu.app"],
  ["Citra","https://citra-emu.org"]
 ],
 ROMS:[
  ["Internet Archive","https://archive.org/details/softwarelibrary"],
  ["ROMHacking","https://www.romhacking.net"],
  ["Open Source Clones","https://osgameclones.com"],
  ["Itch.io Free","https://itch.io/games/free"]
 ],
 TRAINERS:[
  ["FLiNG","https://flingtrainer.com"],
  ["Cheat Engine","https://cheatengine.org"],
  ["ReShade","https://reshade.me"],
  ["GameBanana","https://gamebanana.com"]
 ],
 ANDROID:[
  ["Genymotion","https://www.genymotion.com"],
  ["Android Studio","https://developer.android.com/studio"],
  ["BlueStacks","https://www.bluestacks.com"],
  ["LDPlayer","https://www.ldplayer.net"]
 ]
};

function launch(){
 const key=tiles[activeIndex].textContent;
 document.getElementById("panelTitle").textContent=key;
 const grid=document.getElementById("panelGrid");
 grid.innerHTML="";
 data[key].forEach(item=>{
   const div=document.createElement("div");
   div.className="card";
   div.textContent=item[0];
   div.onclick=()=>window.open(item[1],"_blank");
   grid.appendChild(div);
 });
 document.getElementById("contentPanel").classList.add("active");
}

function closePanel(){document.getElementById("contentPanel").classList.remove("active");}
function openSettings(){document.getElementById("settingsPanel").classList.add("active");}
function closeSettings(){document.getElementById("settingsPanel").classList.remove("active");}
function goHome(){closePanel();closeSettings();}
</script>

</body>
</html>
